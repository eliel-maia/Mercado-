<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mercado Compare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Variáveis de cores para Tema Claro e Escuro */
    :root {
      --bg-page: #F1F1F3;
      --bg-card: #FCFCFE;
      --border-color: #E2E8F0;
      --bg-input: #F9FAFC;
      --text-main: #1c1c1e;
      --text-sub: #6e6e73;
      --sticky-bg: #F9FAFC;
    }

    html.dark {
      --bg-page: #121212;
      --bg-card: #1e1e1e;
      --border-color: #2c2c2e;
      --bg-input: #121212;
      --text-main: #f4f4f5;
      --text-sub: #a1a1aa;
      --sticky-bg: #18181b;
    }

    html, body {
      background-color: var(--bg-page) !important;
      color: var(--text-main) !important;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    .app-card {
      background-color: var(--bg-card) !important;
      border-color: var(--border-color) !important;
    }

    input, select {
      background-color: var(--bg-input) !important;
      color: var(--text-main) !important;
      border-color: var(--border-color) !important;
    }

    .sticky-col {
      position: sticky;
      left: 0;
      z-index: 10;
      background-color: var(--bg-card) !important;
    }
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background-color: var(--sticky-bg) !important;
    }
    /* Célula do canto superior esquerdo (ITEM) fixa tanto no topo quanto à esquerda */
    .sticky-top-left {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 40;
      background-color: var(--sticky-bg) !important;
    }

    .scrollbar-thin::-webkit-scrollbar {
      height: 4px;
      width: 4px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Main Container -->
  <main class="flex-1 w-full space-y-3 pt-2 pb-6">

    <!-- Card Superior Flutuante -->
    <div class="px-2 sm:px-3">
      <div class="max-w-md mx-auto app-card p-4 rounded-3xl shadow-xl border space-y-3.5 relative overflow-hidden">
        
        <!-- Linha 1: Marca + Alternador de Tema + Restauração -->
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2.5">
            <div class="bg-[#5856d6]/10 text-[#5856d6] p-2 rounded-2xl shadow-inner">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
              </svg>
            </div>
            <div>
              <h1 class="text-base font-bold leading-tight tracking-tight">Mercado Compare</h1>
            </div>
          </div>

          <!-- Botões de Ação (Tema e Reset) -->
          <div class="flex items-center space-x-1.5">
            <button id="themeToggleBtn" title="Alternar Tema" class="p-2 border border-[var(--border-color)] bg-[var(--bg-input)] hover:opacity-80 rounded-xl transition-all shadow-sm">
              <svg id="sunIcon" class="w-4 h-4 text-amber-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
              <svg id="moonIcon" class="w-4 h-4 text-[#5856d6]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.03 9.03 0 0012 21a9.03 9.03 0 008.354-5.646z"></path></svg>
            </button>
            <button id="resetBtn" title="Restaurar dados" class="p-2 border border-[var(--border-color)] bg-[var(--bg-input)] hover:opacity-80 rounded-xl transition-all shadow-sm">
              <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
          </div>
        </div>

        <!-- Linha 2: Barra de Pesquisa -->
        <div class="relative w-full">
          <input type="text" id="searchInput" placeholder="Pesquisar..." class="w-full pl-9 pr-3 py-2 text-xs placeholder-zinc-400 rounded-2xl border focus:outline-none focus:ring-2 focus:ring-[#5856d6] font-medium">
          <svg class="w-4 h-4 opacity-40 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>

        <!-- Linha 3: Botões Principais -->
        <div class="flex items-center gap-2 pt-0.5">
          <button id="addItemBtn" class="flex-1 bg-[#5856d6] hover:bg-[#4f46e5] active:bg-[#4338ca] text-white py-2 px-3 rounded-2xl text-xs font-bold flex items-center justify-center space-x-1.5 shadow-md transition-all active:scale-95">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
            <span>Novo Item</span>
          </button>

          <button id="manageStoresBtn" class="flex-1 bg-[var(--bg-input)] hover:opacity-80 py-2 px-3 rounded-2xl text-xs font-bold flex items-center justify-center space-x-1.5 border border-[var(--border-color)] shadow-sm transition-all active:scale-95">
            <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0v-4m0 4h4m-4-4l-4 4m4-4l4 4"></path></svg>
            <span>Mercados</span>
          </button>
        </div>

      </div>
    </div>

    <!-- Store Summary Cards -->
    <div class="px-2 sm:px-3">
      <div class="max-w-md mx-auto app-card px-2 py-2.5 rounded-2xl border shadow-lg overflow-x-auto scrollbar-thin">
        <div id="storeSummaries" class="flex items-center divide-x divide-[var(--border-color)] w-full min-w-max">
          <!-- Injetado via JS -->
        </div>
      </div>
    </div>

    <!-- Table Container (100% da Largura da Tela) -->
    <div class="w-full app-card border-y border-[var(--border-color)] overflow-hidden shadow-lg">
      <div id="tableScrollContainer" class="overflow-x-auto scrollbar-thin max-h-[calc(100vh-320px)] overflow-y-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr id="tableHeaderRow" class="border-b border-[var(--border-color)] font-semibold opacity-70">
              <!-- Renderizado via JS -->
            </tr>
          </thead>
          <tbody id="itemsTableBody" class="divide-y divide-[var(--border-color)]">
            <!-- Linhas dinâmicas -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Modal Adicionar/Editar Item -->
  <div id="itemModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="app-card rounded-3xl max-w-md w-full p-4 space-y-3 shadow-2xl border border-[var(--border-color)] max-h-[90vh] overflow-y-auto scrollbar-thin">
      <h3 id="modalTitle" class="text-sm font-bold">Adicionar Item</h3>
      
      <form id="itemForm" class="space-y-3">
        <input type="hidden" id="itemId">
        
        <div class="grid grid-cols-4 gap-2">
          <div class="col-span-2">
            <label class="block text-[11px] font-semibold opacity-60 mb-1">Nome do Item</label>
            <input type="text" id="itemName" required class="w-full px-3 py-2 text-xs border border-[var(--border-color)] rounded-xl focus:outline-none focus:ring-2 focus:ring-[#5856d6]">
          </div>
          <div>
            <label class="block text-[11px] font-semibold opacity-60 mb-1">Qtd</label>
            <input type="number" id="itemQuantity" min="1" value="1" required class="w-full px-2.5 py-2 text-xs border border-[var(--border-color)] rounded-xl focus:outline-none focus:ring-2 focus:ring-[#5856d6] font-bold text-center">
          </div>
          <div>
            <label class="block text-[11px] font-semibold opacity-60 mb-1">Medida</label>
            <select id="itemUnit" class="w-full px-2 py-2 text-xs border border-[var(--border-color)] rounded-xl focus:outline-none focus:ring-2 focus:ring-[#5856d6] font-medium">
              <option value="UN">UN</option>
              <option value="Kg">Kg</option>
              <option value="L">L</option>
              <option value="g">g</option>
              <option value="ml">ml</option>
              <option value="Pct">Pct</option>
              <option value="Cx">Cx</option>
            </select>
          </div>
        </div>

        <div id="priceInputs" class="space-y-2 pt-1">
          <label class="block text-[11px] font-semibold opacity-60">Preço Unitário e Observações por Mercado</label>
          <!-- Inputs de preços dinâmicos -->
        </div>

        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" id="closeItemModal" class="px-4 py-2 text-xs font-medium opacity-70 hover:opacity-100 rounded-xl transition-colors">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-xs bg-[#5856d6] hover:bg-[#4f46e5] text-white rounded-xl font-bold shadow-md transition-colors">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Gerenciar Mercados -->
  <div id="storeModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="app-card rounded-3xl max-w-sm w-full p-4 space-y-3.5 shadow-2xl border border-[var(--border-color)]">
      <h3 class="text-sm font-bold">Gerenciar Mercados</h3>
      
      <div id="storeList" class="space-y-1.5 max-h-48 overflow-y-auto">
        <!-- Lista de mercados -->
      </div>

      <div class="flex gap-2 pt-1">
        <input type="text" id="newStoreName" placeholder="Novo Mercado..." class="flex-1 px-3 py-2 text-xs border border-[var(--border-color)] rounded-xl focus:outline-none focus:ring-2 focus:ring-[#5856d6]">
        <button id="addStoreBtn" class="px-3.5 py-2 text-xs bg-[#5856d6] hover:bg-[#4f46e5] text-white rounded-xl font-bold transition-colors">Adicionar</button>
      </div>

      <div class="flex justify-end pt-2">
        <button id="closeStoreModal" class="px-4 py-2 text-xs font-medium opacity-70 hover:opacity-100 rounded-xl transition-colors">Fechar</button>
      </div>
    </div>
  </div>

  <script>
    const defaultStores = [
      { id: 's1', name: 'Coop' },
      { id: 's2', name: 'Tauste' },
      { id: 's3', name: 'Garça' },
      { id: 's4', name: 'Atacadão' }
    ];

    const defaultItems = [
      { id: '1', name: 'Papel Higiênico H', quantity: 1, unit: 'UN', checked: false, prices: { s1: 27.90, s2: 27.99, s3: 23.99, s4: 22.50 }, storeNotes: { s3: 'c/24 fls' } },
      { id: '2', name: 'Listerine', quantity: 1, unit: 'UN', checked: false, prices: { s1: 16.98, s2: 36.90, s3: 22.99, s4: 18.90 }, storeNotes: { s1: '500ml' } },
      { id: '3', name: 'Asepxia', quantity: 1, unit: 'UN', checked: false, prices: { s1: 11.45, s2: 11.20, s3: null, s4: 10.99 }, storeNotes: {} },
      { id: '4', name: 'Filtro Café', quantity: 2, unit: 'UN', checked: false, prices: { s1: 4.29, s2: 4.29, s3: 4.29, s4: 3.99 }, storeNotes: { s1: '3 corações' } },
      { id: '5', name: 'Guardanapo', quantity: 1, unit: 'UN', checked: false, prices: { s1: 8.59, s2: 8.59, s3: 7.99, s4: 8.10 }, storeNotes: { s3: '200 folhas' } },
      { id: '6', name: 'Mamão', quantity: 1, unit: 'Kg', checked: false, prices: { s1: 11.98, s2: 13.90, s3: 9.99, s4: 10.50 }, storeNotes: {} },
      { id: '7', name: 'Maçã', quantity: 1, unit: 'Kg', checked: false, prices: { s1: 9.45, s2: 9.80, s3: 8.99, s4: 8.79 }, storeNotes: {} },
      { id: '8', name: 'Banana', quantity: 1, unit: 'Kg', checked: false, prices: { s1: 8.35, s2: 7.00, s3: 6.99, s4: 7.50 }, storeNotes: {} },
      { id: '9', name: 'Uva', quantity: 1, unit: 'UN', checked: false, prices: { s1: 9.55, s2: null, s3: null, s4: 8.99 }, storeNotes: {} },
      { id: '10', name: 'Pão de Forma', quantity: 1, unit: 'UN', checked: false, prices: { s1: 10.90, s2: 8.78, s3: 6.99, s4: 7.20 }, storeNotes: {} },
      { id: '11', name: 'Bisnaguinha', quantity: 1, unit: 'UN', checked: false, prices: { s1: 9.79, s2: 7.88, s3: 7.99, s4: 6.89 }, storeNotes: {} }
    ];

    let stores = [];
    let items = [];
    let activeStoreFilter = null; // Guarda o ID do mercado filtrado atualmente

    // Chaves atualizadas para a Versão 36
    function initData() {
      try {
        const savedStores = localStorage.getItem('mc_stores_v36');
        const savedItems = localStorage.getItem('mc_items_v36');
        stores = savedStores ? JSON.parse(savedStores) : defaultStores;
        items = savedItems ? JSON.parse(savedItems) : defaultItems;
      } catch (e) {
        stores = defaultStores;
        items = defaultItems;
      }
    }

    function saveData() {
      localStorage.setItem('mc_stores_v36', JSON.stringify(stores));
      localStorage.setItem('mc_items_v36', JSON.stringify(items));
    }

    function formatCurrency(value) {
      if (value === null || value === undefined || isNaN(value)) return '-';
      return `R$&nbsp;${value.toFixed(2).replace('.', ',')}`;
    }

    function renderAll() {
      renderHeaders();
      renderItems();
      renderSummaries();
    }

    function renderHeaders() {
      const headerRow = document.getElementById('tableHeaderRow');
      let html = `
        <th class="p-2.5 sticky-top-left border-r border-b border-[var(--border-color)] w-[145px] min-w-[145px] text-[11px] font-bold tracking-wider">
          ITEM
        </th>
      `;
      
      stores.forEach((store, index) => {
        html += `
          <th data-store-col="${store.id}" class="p-2.5 text-center uppercase tracking-wider text-[11px] font-bold w-[95px] min-w-[95px] sticky-header border-b border-[var(--border-color)]">
            ${store.name}
          </th>
        `;
      });

      html += `<th class="p-2.5 text-center w-[36px] min-w-[36px] sticky-header border-b border-[var(--border-color)]"></th>`;
      headerRow.innerHTML = html;
    }

    function renderItems() {
      const tbody = document.getElementById('itemsTableBody');
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      
      let filteredItems = items.filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(searchQuery);
        
        if (activeStoreFilter) {
          const validPrices = Object.entries(item.prices)
            .filter(([storeId, price]) => stores.some(s => s.id === storeId) && price !== null && price > 0)
            .map(([_, price]) => price);
          
          if (validPrices.length === 0) return false;
          const minPrice = Math.min(...validPrices);
          const priceInStore = item.prices[activeStoreFilter];
          
          const isCheapestInThisStore = priceInStore !== null && priceInStore === minPrice && validPrices.length > 1;
          return matchesSearch && isCheapestInThisStore;
        }

        return matchesSearch;
      });

      if (filteredItems.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="${stores.length + 2}" class="p-8 text-center opacity-50 text-xs">
              Nenhum produto encontrado.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filteredItems.map(item => {
        const qty = item.quantity || 1;
        
        const validPrices = Object.entries(item.prices)
          .filter(([storeId, price]) => stores.some(s => s.id === storeId) && price !== null && price > 0)
          .map(([_, price]) => price);
        
        const minPrice = validPrices.length > 0 ? Math.min(...validPrices) : null;
        
        const qtyBadge = `<span class="inline-block px-1 bg-[var(--bg-input)] border border-[var(--border-color)] rounded text-[9px] font-bold mt-0.5 opacity-80">${qty} • ${item.unit || 'UN'}</span>`;

        return `
          <tr class="hover:opacity-90 transition-colors ${item.checked ? 'opacity-40 line-through' : ''}">
            <td class="p-2.5 sticky-col border-r border-[var(--border-color)] w-[145px] min-w-[145px]">
              <div class="flex items-center space-x-1.5">
                <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleItemCheck('${item.id}')" class="rounded text-[#5856d6] focus:ring-[#5856d6] w-3.5 h-3.5 flex-shrink-0">
                <div class="truncate">
                  <div class="font-semibold truncate text-xs leading-snug">${item.name}</div>
                  <div>${qtyBadge}</div>
                </div>
              </div>
            </td>

            ${stores.map(store => {
              const price = item.prices[store.id];
              const storeNote = item.storeNotes && item.storeNotes[store.id] ? item.storeNotes[store.id] : '';
              const isCheapest = price !== null && price === minPrice && validPrices.length > 1;

              return `
                <td class="p-2.5 text-center whitespace-nowrap w-[95px] min-w-[95px]">
                  <div class="flex flex-col items-center justify-center">
                    <span class="inline-block px-1.5 py-0.5 rounded-lg text-[11px] font-bold leading-tight ${isCheapest ? 'bg-emerald-600 text-white shadow-sm' : 'opacity-70'}">
                      ${formatCurrency(price)}
                    </span>
                    ${storeNote ? `<span class="text-[10px] opacity-60 font-medium truncate max-w-[85px] mt-0.5">${storeNote}</span>` : ''}
                  </div>
                </td>
              `;
            }).join('')}

            <td class="p-2 text-center w-[36px] min-w-[36px]">
              <button onclick="openEditItemModal('${item.id}')" class="opacity-50 hover:opacity-100 p-1 rounded-lg transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderSummaries() {
      const container = document.getElementById('storeSummaries');
      
      const storeTotals = {};
      const storeCounts = {};

      stores.forEach(s => {
        storeTotals[s.id] = 0;
        storeCounts[s.id] = 0;
      });

      items.forEach(item => {
        const qty = item.quantity || 1;
        const validPrices = Object.entries(item.prices)
          .filter(([storeId, price]) => stores.some(s => s.id === storeId) && price !== null && price > 0)
          .map(([_, price]) => price);

        if (validPrices.length > 0) {
          const minPrice = Math.min(...validPrices);

          stores.forEach(store => {
            const price = item.prices[store.id];
            if (price !== null && price === minPrice) {
              storeTotals[store.id] += (price * qty);
              storeCounts[store.id] += 1;
            }
          });
        }
      });

      container.innerHTML = stores.map(store => {
        const greenTotal = storeTotals[store.id] || 0;
        const greenCount = storeCounts[store.id] || 0;
        const hasBest = greenCount > 0;
        const isSelected = activeStoreFilter === store.id;

        return `
          <div onclick="toggleStoreFilter('${store.id}')" class="flex-1 px-2 text-center min-w-[75px] max-w-[100px] cursor-pointer rounded-xl transition-all py-1 ${isSelected ? 'bg-[#5856d6]/20 border border-[#5856d6]/40 shadow-inner' : 'hover:opacity-80'}">
            <div class="flex items-center justify-center space-x-1">
              <span class="text-[10px] font-semibold ${isSelected ? 'text-[#5856d6] font-bold' : 'opacity-70'} truncate">${store.name}</span>
              ${hasBest ? '<span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>' : ''}
            </div>
            <div class="text-xs font-bold ${hasBest ? 'text-emerald-500' : 'opacity-60'} leading-tight mt-0.5 whitespace-nowrap">
              ${formatCurrency(greenTotal)}
            </div>
            <div class="text-[9px] opacity-50 mt-0.5 font-medium">${greenCount} verde${greenCount !== 1 ? 's' : ''}</div>
          </div>
        `;
      }).join('');
    }

    function toggleStoreFilter(storeId) {
      if (activeStoreFilter === storeId) {
        activeStoreFilter = null; // Desmarca se clicar de novo
      } else {
        activeStoreFilter = storeId; // Ativa o filtro para este mercado
        
        // Rola a tabela horizontalmente para alinhar a coluna do mercado escolhido
        setTimeout(() => {
          const scrollContainer = document.getElementById('tableScrollContainer');
          const targetTh = document.querySelector(`[data-store-col="${storeId}"]`);
          if (scrollContainer && targetTh) {
            const scrollLeftPos = targetTh.offsetLeft - 145; // compensa a coluna fixa do item
            scrollContainer.scrollTo({ left: scrollLeftPos, behavior: 'smooth' });
          }
        }, 50);
      }
      renderItems();
      renderSummaries();
    }

    function toggleItemCheck(id) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.checked = !item.checked;
        saveData();
        renderAll();
      }
    }

    const itemModal = document.getElementById('itemModal');
    document.getElementById('addItemBtn').onclick = () => openItemModal();
    document.getElementById('closeItemModal').onclick = () => itemModal.classList.add('hidden');

    function openItemModal(item = null) {
      document.getElementById('modalTitle').innerText = item ? 'Editar Item' : 'Novo Item';
      document.getElementById('itemId').value = item ? item.id : '';
      document.getElementById('itemName').value = item ? item.name : '';
      document.getElementById('itemQuantity').value = item ? (item.quantity || 1) : 1;
      document.getElementById('itemUnit').value = item ? (item.unit || 'UN') : 'UN';

      const priceInputsContainer = document.getElementById('priceInputs');
      priceInputsContainer.innerHTML = stores.map(store => `
        <div class="space-y-1 bg-[var(--bg-input)] p-2 rounded-xl border border-[var(--border-color)]">
          <span class="text-xs font-bold block">${store.name}</span>
          <div class="flex gap-2">
            <input type="number" step="0.01" data-store-id="${store.id}" value="${item && item.prices[store.id] !== undefined && item.prices[store.id] !== null ? item.prices[store.id] : ''}" placeholder="Preço (R$)" class="store-price-input w-28 px-2.5 py-1.5 text-xs border border-[var(--border-color)] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#5856d6]">
            <input type="text" data-store-note-id="${store.id}" value="${item && item.storeNotes && item.storeNotes[store.id] ? item.storeNotes[store.id] : ''}" placeholder="Obs/Marca..." class="store-note-input flex-1 px-2.5 py-1.5 text-xs border border-[var(--border-color)] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#5856d6]">
          </div>
        </div>
      `).join('');

      itemModal.classList.remove('hidden');
    }

    function openEditItemModal(id) {
      const item = items.find(i => i.id === id);
      if (item) openItemModal(item);
    }

    document.getElementById('itemForm').onsubmit = (e) => {
      e.preventDefault();
      const id = document.getElementById('itemId').value;
      const name = document.getElementById('itemName').value;
      const quantity = parseInt(document.getElementById('itemQuantity').value) || 1;
      const unit = document.getElementById('itemUnit').value;

      const prices = {};
      const storeNotes = {};

      document.querySelectorAll('.store-price-input').forEach(input => {
        const storeId = input.getAttribute('data-store-id');
        const val = parseFloat(input.value);
        prices[storeId] = isNaN(val) ? null : val;
      });

      document.querySelectorAll('.store-note-input').forEach(input => {
        const storeId = input.getAttribute('data-store-note-id');
        const text = input.value.trim();
        if (text) storeNotes[storeId] = text;
      });

      if (id) {
        const item = items.find(i => i.id === id);
        if (item) {
          item.name = name;
          item.quantity = quantity;
          item.unit = unit;
          item.prices = prices;
          item.storeNotes = storeNotes;
        }
      } else {
        items.push({
          id: Date.now().toString(),
          name,
          quantity,
          unit,
          checked: false,
          prices,
          storeNotes
        });
      }

      saveData();
      renderAll();
      itemModal.classList.add('hidden');
    };

    const storeModal = document.getElementById('storeModal');
    document.getElementById('manageStoresBtn').onclick = () => openStoreModal();
    document.getElementById('closeStoreModal').onclick = () => storeModal.classList.add('hidden');

    function openStoreModal() {
      const storeList = document.getElementById('storeList');
      storeList.innerHTML = stores.map(store => `
        <div class="flex items-center justify-between bg-[var(--bg-input)] p-2.5 rounded-2xl border border-[var(--border-color)]">
          <span class="text-xs font-semibold">${store.name}</span>
          <button onclick="removeStore('${store.id}')" class="text-rose-500 hover:opacity-80 p-1 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          </button>
        </div>
      `).join('');
      storeModal.classList.remove('hidden');
    }

    document.getElementById('addStoreBtn').onclick = () => {
      const input = document.getElementById('newStoreName');
      const name = input.value.trim();
      if (name) {
        stores.push({ id: 's_' + Date.now(), name });
        input.value = '';
        saveData();
        renderAll();
        openStoreModal();
      }
    };

    function removeStore(id) {
      if (stores.length <= 1) {
        alert('Você precisa ter pelo menos um mercado cadastrado.');
        return;
      }
      stores = stores.filter(s => s.id !== id);
      saveData();
      renderAll();
      openStoreModal();
    }

    document.getElementById('searchInput').oninput = () => renderItems();

    document.getElementById('resetBtn').onclick = () => {
      if (confirm('Deseja restaurar os dados originais?')) {
        stores = defaultStores;
        items = defaultItems;
        activeStoreFilter = null;
        saveData();
        renderAll();
      }
    };

    // Alternador de Tema Claro / Escuro
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    function applyTheme(isDark) {
      if (isDark) {
        document.documentElement.classList.add('dark');
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
        localStorage.setItem('mc_theme', 'dark');
      } else {
        document.documentElement.classList.remove('dark');
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
        localStorage.setItem('mc_theme', 'light');
      }
    }

    themeToggleBtn.onclick = () => {
      const isCurrentlyDark = document.documentElement.classList.contains('dark');
      applyTheme(!isCurrentlyDark);
    };

    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('mc_theme');
      if (savedTheme === 'light') {
        applyTheme(false);
      } else {
        applyTheme(true);
      }

      initData();
      renderAll();
    });
  </script>
</body>
</html>
