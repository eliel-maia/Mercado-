<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mercado Compare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .scrollbar-thin::-webkit-scrollbar {
      height: 4px;
      width: 4px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .dark .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #334155;
    }
    .sticky-col {
      position: sticky;
      left: 0;
      z-index: 10;
      background-color: #ffffff;
    }
    .dark .sticky-col {
      background-color: #1e293b;
    }
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .sticky-top-left {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 30;
      background-color: #f8fafc;
    }
    .dark .sticky-top-left {
      background-color: #0f172a;
    }
  </style>
</head>
<body class="bg-[#f4f6fa] dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- Main Container -->
  <main class="flex-1 w-full mx-auto space-y-3 p-2 sm:p-3 pb-6">

    <!-- Card Superior Flutuante -->
    <div class="max-w-md mx-auto bg-white dark:bg-slate-800 p-4 rounded-3xl shadow-sm border border-slate-200/80 dark:border-slate-700/80 space-y-3.5 relative overflow-hidden">
      
      <!-- Linha 1: Marca + Controlo de Tema e Reset -->
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
          <div class="bg-emerald-50 dark:bg-slate-700 text-emerald-600 dark:text-emerald-400 p-2 rounded-2xl shadow-inner">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
            </svg>
          </div>
          <div>
            <h1 class="text-base font-bold leading-tight tracking-tight text-slate-900 dark:text-white">Mercado Compare</h1>
            <p class="text-[10px] text-slate-400 font-medium">Gestão e Comparação de Preços</p>
          </div>
        </div>

        <!-- Botões de Ação Secundários (Tema + Reset) -->
        <div class="flex items-center space-x-1.5">
          <button id="themeToggle" title="Tema" class="p-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 rounded-xl transition-all shadow-sm">
            <svg id="sunIcon" class="w-4 h-4 hidden text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg id="moonIcon" class="w-4 h-4 text-slate-600 dark:text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.03 9.03 0 0012 21a9.03 9.03 0 008.354-5.646z"></path></svg>
          </button>
          <button id="resetBtn" title="Restaurar dados" class="p-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 rounded-xl transition-all shadow-sm">
            <svg class="w-4 h-4 text-slate-600 dark:text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          </button>
        </div>
      </div>

      <!-- Linha 2: Barra de Pesquisa Clara -->
      <div class="relative w-full">
        <input type="text" id="searchInput" placeholder="Pesquisar..." class="w-full pl-9 pr-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 placeholder-slate-400 rounded-2xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm font-medium">
        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>

      <!-- Linha 3: Botões Principais de Ação -->
      <div class="flex items-center gap-2 pt-0.5">
        <button id="addItemBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white py-2 px-3 rounded-2xl text-xs font-bold flex items-center justify-center space-x-1.5 shadow-sm transition-all active:scale-95">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
          <span>Novo Item</span>
        </button>

        <button id="manageStoresBtn" class="flex-1 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 py-2 px-3 rounded-2xl text-xs font-bold flex items-center justify-center space-x-1.5 border border-slate-200/60 dark:border-slate-600/60 shadow-sm transition-all active:scale-95">
          <svg class="w-4 h-4 text-slate-500 dark:text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0v-4m0 4h4m-4-4l-4 4m4-4l4 4"></path></svg>
          <span>Mercados</span>
        </button>
      </div>

    </div>

    <!-- Store Summary Cards -->
    <div class="w-full">
      <div class="bg-white dark:bg-slate-800 px-2 py-2.5 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm overflow-x-auto scrollbar-thin">
        <div id="storeSummaries" class="flex items-center divide-x divide-slate-200 dark:divide-slate-700 w-full min-w-max">
          <!-- Injetado dinamicamente via JS -->
        </div>
      </div>
    </div>

    <!-- Table Container -->
    <div class="w-full bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700/80 rounded-2xl overflow-hidden shadow-sm">
      <div class="overflow-x-auto scrollbar-thin max-h-[calc(100vh-320px)] overflow-y-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr id="tableHeaderRow" class="border-b border-slate-200 dark:border-slate-700 font-semibold text-slate-500 dark:text-slate-400">
              <!-- Renderizado via JS -->
            </tr>
          </thead>
          <tbody id="itemsTableBody" class="divide-y divide-slate-100 dark:divide-slate-700/50">
            <!-- Linhas dos itens dinâmicas -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Modal Adicionar/Editar Item -->
  <div id="itemModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-4 space-y-3 shadow-2xl border border-slate-200 dark:border-slate-700 max-h-[90vh] overflow-y-auto scrollbar-thin">
      <h3 id="modalTitle" class="text-sm font-bold text-slate-900 dark:text-white">Adicionar Item</h3>
      
      <form id="itemForm" class="space-y-3">
        <input type="hidden" id="itemId">
        
        <div class="grid grid-cols-4 gap-2">
          <div class="col-span-2">
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Nome do Item</label>
            <input type="text" id="itemName" required class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-600">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Qtd</label>
            <input type="number" id="itemQuantity" min="1" value="1" required class="w-full px-2.5 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-600 font-bold text-center">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Medida</label>
            <select id="itemUnit" class="w-full px-2 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-600 font-medium">
              <option value="UN">UN</option>
              <option value="Kg">Kg</option>
              <option value="L">L</option>
              <option value="g">g</option>
              <option value="ml">ml</option>
              <option value="Pct">Pct</option>
              <option value="Cx">Cx</option>
            </select>
          </div>
        </div>

        <div id="priceInputs" class="space-y-2 pt-1">
          <label class="block text-[11px] font-semibold text-slate-500">Preço Unitário e Observações por Mercado</label>
          <!-- Inputs de preços + notas dinâmicos -->
        </div>

        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" id="closeItemModal" class="px-4 py-2 text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition-colors">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-xs bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow-sm transition-colors">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Gerenciar Mercados -->
  <div id="storeModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-sm w-full p-4 space-y-3.5 shadow-2xl border border-slate-200 dark:border-slate-700">
      <h3 class="text-sm font-bold text-slate-900 dark:text-white">Gerenciar Mercados</h3>
      
      <div id="storeList" class="space-y-1.5 max-h-48 overflow-y-auto">
        <!-- Lista de mercados para editar/remover -->
      </div>

      <div class="flex gap-2 pt-1">
        <input type="text" id="newStoreName" placeholder="Novo Mercado..." class="flex-1 px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-600">
        <button id="addStoreBtn" class="px-3.5 py-2 text-xs bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold transition-colors">Adicionar</button>
      </div>

      <div class="flex justify-end pt-2">
        <button id="closeStoreModal" class="px-4 py-2 text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition-colors">Fechar</button>
      </div>
    </div>
  </div>

  <script>
    // DADOS INICIAIS
    const defaultStores = [
      { id: 's1', name: 'Coop' },
      { id: 's2', name: 'Tauste' },
      { id: 's3', name: 'Garça' },
      { id: 's4', name: 'Atacadão' }
    ];

    const defaultItems = [
      { id: '1', name: 'Papel Higiênico H', quantity: 1, unit: 'UN', checked: false, prices: { s1: 27.90, s2: 27.99, s3: 23.99, s4: 22.50 }, storeNotes: { s3: 'c/24 fls' } },
      { id: '2', name: 'Listerine', quantity: 1, unit: 'UN', checked: false, prices: { s1: 16.98, s2: 36.90, s3: 22.99, s4: 18.90 }, storeNotes: { s1: '500ml' } },
      { id: '3', name: 'Asepxia', quantity: 1, unit: 'UN', checked: false, prices: { s1: 11.45, s2: 11.20, s3: null, s4: 10.99 }, storeNotes: {} },
      { id: '4', name: 'Filtro Café', quantity: 2, unit: 'UN', checked: false, prices: { s1: 4.29, s2: 4.29, s3: 4.29, s4: 3.99 }, storeNotes: { s1: '3 corações' } },
      { id: '5', name: 'Guardanapo', quantity: 1, unit: 'UN', checked: false, prices: { s1: 8.59, s2: 8.59, s3: 7.99, s4: 8.10 }, storeNotes: { s3: '200 folhas' } },
      { id: '6', name: 'Mamão', quantity: 1, unit: 'Kg', checked: false, prices: { s1: 11.98, s2: 13.90, s3: 9.99, s4: 10.50 }, storeNotes: {} },
      { id: '7', name: 'Maçã', quantity: 1, unit: 'Kg', checked: false, prices: { s1: 9.45, s2: 9.80, s3: 8.99, s4: 8.79 }, storeNotes: {} },
      { id: '8', name: 'Banana', quantity: 1, unit: 'Kg', checked: false, prices: { s1: 8.35, s2: 7.00, s3: 6.99, s4: 7.50 }, storeNotes: {} },
      { id: '9', name: 'Uva', quantity: 1, unit: 'UN', checked: false, prices: { s1: 9.55, s2: null, s3: null, s4: 8.99 }, storeNotes: {} },
      { id: '10', name: 'Pão de Forma', quantity: 1, unit: 'UN', checked: false, prices: { s1: 10.90, s2: 8.78, s3: 6.99, s4: 7.20 }, storeNotes: {} },
      { id: '11', name: 'Bisnaguinha', quantity: 1, unit: 'UN', checked: false, prices: { s1: 9.79, s2: 7.88, s3: 7.99, s4: 6.89 }, storeNotes: {} }
    ];

    let stores = [];
    let items = [];

    function initData() {
      try {
        const savedStores = localStorage.getItem('mc_stores_v23');
        const savedItems = localStorage.getItem('mc_items_v23');
        stores = savedStores ? JSON.parse(savedStores) : defaultStores;
        items = savedItems ? JSON.parse(savedItems) : defaultItems;
      } catch (e) {
        stores = defaultStores;
        items = defaultItems;
      }
    }

    function saveData() {
      localStorage.setItem('mc_stores_v23', JSON.stringify(stores));
      localStorage.setItem('mc_items_v23', JSON.stringify(items));
    }

    function formatCurrency(value) {
      if (value === null || value === undefined || isNaN(value)) return '-';
      return `R$&nbsp;${value.toFixed(2).replace('.', ',')}`;
    }

    function renderAll() {
      renderHeaders();
      renderItems();
      renderSummaries();
    }

    function renderHeaders() {
      const headerRow = document.getElementById('tableHeaderRow');
      let html = `
        <th class="p-2.5 sticky-top-left border-r border-b border-slate-200 dark:border-slate-700 w-[145px] min-w-[145px] text-[11px] font-bold tracking-wider">
          ITEM
        </th>
      `;
      
      stores.forEach(store => {
        html += `
          <th class="p-2.5 text-center uppercase tracking-wider text-[11px] font-bold w-[95px] min-w-[95px] sticky-header bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700">
            ${store.name}
          </th>
        `;
      });

      html += `<th class="p-2.5 text-center w-[36px] min-w-[36px] sticky-header bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700"></th>`;
      headerRow.innerHTML = html;
    }

    function renderItems() {
      const tbody = document.getElementById('itemsTableBody');
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      const filteredItems = items.filter(item => item.name.toLowerCase().includes(searchQuery));

      if (filteredItems.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="${stores.length + 2}" class="p-8 text-center text-slate-400 text-xs">
              Nenhum produto encontrado.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filteredItems.map(item => {
        const qty = item.quantity || 1;
        
        const validPrices = Object.entries(item.prices)
          .filter(([storeId, price]) => stores.some(s => s.id === storeId) && price !== null && price > 0)
          .map(([_, price]) => price);
        
        const minPrice = validPrices.length > 0 ? Math.min(...validPrices) : null;
        
        const qtyBadge = `<span class="inline-block px-1 bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 rounded text-[9px] font-bold ml-1">Qtd: ${qty} • ${item.unit || 'UN'}</span>`;

        return `
          <tr class="hover:bg-slate-50/80 dark:hover:bg-slate-700/30 transition-colors ${item.checked ? 'opacity-50 line-through bg-slate-50/50 dark:bg-slate-800/50' : ''}">
            <td class="p-2.5 sticky-col border-r border-slate-200 dark:border-slate-700 w-[145px] min-w-[145px]">
              <div class="flex items-center space-x-1.5">
                <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleItemCheck('${item.id}')" class="rounded border-slate-300 text-emerald-600 focus:ring-emerald-600 w-3.5 h-3.5 flex-shrink-0">
                <div class="truncate">
                  <div class="font-semibold text-slate-900 dark:text-slate-100 truncate text-xs leading-snug flex items-center flex-wrap gap-0.5">
                    <span class="truncate">${item.name}</span> ${qtyBadge}
                  </div>
                </div>
              </div>
            </td>

            ${stores.map(store => {
              const price = item.prices[store.id];
              const storeNote = item.storeNotes && item.storeNotes[store.id] ? item.storeNotes[store.id] : '';
              const isCheapest = price !== null && price === minPrice && validPrices.length > 1;
              const totalPrice = price !== null ? price * qty : null;

              return `
                <td class="p-2.5 text-center whitespace-nowrap w-[95px] min-w-[95px]">
                  <div class="flex flex-col items-center justify-center">
                    <span class="inline-block px-2 py-0.5 rounded-lg text-xs font-bold leading-tight ${isCheapest ? 'bg-emerald-100 text-slate-900 dark:bg-emerald-950/90 dark:text-emerald-200 shadow-sm' : 'text-slate-400 dark:text-slate-500'}">
                      ${formatCurrency(totalPrice)}
                    </span>
                    ${qty > 1 && price !== null ? `<span class="text-[8px] text-slate-400 dark:text-slate-500 font-medium truncate max-w-[85px]">(${formatCurrency(price)} un)</span>` : ''}
                    ${storeNote ? `<span class="text-[9px] text-slate-400 dark:text-slate-500 font-medium truncate max-w-[85px] mt-0.5">${storeNote}</span>` : ''}
                  </div>
                </td>
              `;
            }).join('')}

            <td class="p-2 text-center w-[36px] min-w-[36px]">
              <button onclick="openEditItemModal('${item.id}')" class="text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 p-1 rounded-lg transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderSummaries() {
      const container = document.getElementById('storeSummaries');
      
      const storeTotals = {};
      const storeCounts = {};

      stores.forEach(s => {
        storeTotals[s.id] = 0;
        storeCounts[s.id] = 0;
      });

      items.forEach(item => {
        const qty = item.quantity || 1;
        const validPrices = Object.entries(item.prices)
          .filter(([storeId, price]) => stores.some(s => s.id === storeId) && price !== null && price > 0)
          .map(([_, price]) => price);

        if (validPrices.length > 0) {
          const minPrice = Math.min(...validPrices);

          stores.forEach(store => {
            const price = item.prices[store.id];
            if (price !== null && price === minPrice) {
              storeTotals[store.id] += (price * qty);
              storeCounts[store.id] += 1;
            }
          });
        }
      });

      container.innerHTML = stores.map(store => {
        const greenTotal = storeTotals[store.id] || 0;
        const greenCount = storeCounts[store.id] || 0;
        const hasBest = greenCount > 0;

        return `
          <div class="flex-1 px-2 text-center min-w-[75px] max-w-[100px]">
            <div class="flex items-center justify-center space-x-1">
              <span class="text-[10px] font-semibold text-slate-500 dark:text-slate-400 truncate">${store.name}</span>
              ${hasBest ? '<span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>' : ''}
            </div>
            <div class="text-xs font-bold ${hasBest ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-400 dark:text-slate-500'} leading-tight mt-0.5 whitespace-nowrap">
              ${formatCurrency(greenTotal)}
            </div>
            <div class="text-[9px] text-slate-400 dark:text-slate-500 mt-0.5 font-medium">${greenCount} verde${greenCount !== 1 ? 's' : ''}</div>
          </div>
        `;
      }).join('');
    }

    function toggleItemCheck(id) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.checked = !item.checked;
        saveData();
        renderAll();
      }
    }

    const itemModal = document.getElementById('itemModal');
    document.getElementById('addItemBtn').onclick = () => openItemModal();
    document.getElementById('closeItemModal').onclick = () => itemModal.classList.add('hidden');

    function openItemModal(item = null) {
      document.getElementById('modalTitle').innerText = item ? 'Editar Item' : 'Novo Item';
      document.getElementById('itemId').value = item ? item.id : '';
      document.getElementById('itemName').value = item ? item.name : '';
      document.getElementById('itemQuantity').value = item ? (item.quantity || 1) : 1;
      document.getElementById('itemUnit').value = item ? (item.unit || 'UN') : 'UN';

      const priceInputsContainer = document.getElementById('priceInputs');
      priceInputsContainer.innerHTML = stores.map(store => `
        <div class="space-y-1 bg-slate-50 dark:bg-slate-900 p-2 rounded-xl border border-slate-200/60 dark:border-slate-700/60">
          <span class="text-xs text-slate-700 dark:text-slate-200 font-bold block">${store.name}</span>
          <div class="flex gap-2">
            <input type="number" step="0.01" data-store-id="${store.id}" value="${item && item.prices[store.id] !== undefined && item.prices[store.id] !== null ? item.prices[store.id] : ''}" placeholder="Preço (R$)" class="store-price-input w-28 px-2.5 py-1.5 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600">
            <input type="text" data-store-note-id="${store.id}" value="${item && item.storeNotes && item.storeNotes[store.id] ? item.storeNotes[store.id] : ''}" placeholder="Obs/Marca..." class="store-note-input flex-1 px-2.5 py-1.5 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600">
          </div>
        </div>
      `).join('');

      itemModal.classList.remove('hidden');
    }

    function openEditItemModal(id) {
      const item = items.find(i => i.id === id);
      if (item) openItemModal(item);
    }

    document.getElementById('itemForm').onsubmit = (e) => {
      e.preventDefault();
      const id = document.getElementById('itemId').value;
      const name = document.getElementById('itemName').value;
      const quantity = parseInt(document.getElementById('itemQuantity').value) || 1;
      const unit = document.getElementById('itemUnit').value;

      const prices = {};
      const storeNotes = {};

      document.querySelectorAll('.store-price-input').forEach(input => {
        const storeId = input.getAttribute('data-store-id');
        const val = parseFloat(input.value);
        prices[storeId] = isNaN(val) ? null : val;
      });

      document.querySelectorAll('.store-note-input').forEach(input => {
        const storeId = input.getAttribute('data-store-note-id');
        const text = input.value.trim();
        if (text) storeNotes[storeId] = text;
      });

      if (id) {
        const item = items.find(i => i.id === id);
        if (item) {
          item.name = name;
          item.quantity = quantity;
          item.unit = unit;
          item.prices = prices;
          item.storeNotes = storeNotes;
        }
      } else {
        items.push({
          id: Date.now().toString(),
          name,
          quantity,
          unit,
          checked: false,
          prices,
          storeNotes
        });
      }

      saveData();
      renderAll();
      itemModal.classList.add('hidden');
    };

    const storeModal = document.getElementById('storeModal');
    document.getElementById('manageStoresBtn').onclick = () => openStoreModal();
    document.getElementById('closeStoreModal').onclick = () => storeModal.classList.add('hidden');

    function openStoreModal() {
      const storeList = document.getElementById('storeList');
      storeList.innerHTML = stores.map(store => `
        <div class="flex items-center justify-between bg-slate-50 dark:bg-slate-900 p-2.5 rounded-2xl border border-slate-100 dark:border-slate-700/50">
          <span class="text-xs font-semibold text-slate-700 dark:text-slate-200">${store.name}</span>
          <button onclick="removeStore('${store.id}')" class="text-rose-500 hover:text-rose-700 p-1 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          </button>
        </div>
      `).join('');
      storeModal.classList.remove('hidden');
    }

    document.getElementById('addStoreBtn').onclick = () => {
      const input = document.getElementById('newStoreName');
      const name = input.value.trim();
      if (name) {
        stores.push({ id: 's_' + Date.now(), name });
        input.value = '';
        saveData();
        renderAll();
        openStoreModal();
      }
    };

    function removeStore(id) {
      if (stores.length <= 1) {
        alert('Você precisa ter pelo menos um mercado cadastrado.');
        return;
      }
      stores = stores.filter(s => s.id !== id);
      saveData();
      renderAll();
      openStoreModal();
    }

    document.getElementById('searchInput').oninput = () => renderItems();

    document.getElementById('resetBtn').onclick = () => {
      if (confirm('Deseja restaurar os dados originais?')) {
        stores = defaultStores;
        items = defaultItems;
        saveData();
        renderAll();
      }
    };

    const themeToggle = document.getElementById('themeToggle');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      sunIcon.classList.remove('hidden');
      moonIcon.classList.add('hidden');
    }

    themeToggle.onclick = () => {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      initData();
      renderAll();
    });
  </script>
</body>
</html>
