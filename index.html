<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mercado Compare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .scrollbar-thin::-webkit-scrollbar {
      height: 4px;
      width: 4px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .dark .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #334155;
    }
    .sticky-col {
      position: sticky;
      left: 0;
      z-index: 20;
    }
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .sticky-top-left {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 30;
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- Header -->
  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-40 shadow-sm">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="bg-brand-600 text-white p-2 rounded-xl shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-base font-bold leading-tight text-slate-900 dark:text-white">Mercado Compare</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">Comparador de Preços</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-1">
        <button id="themeToggle" class="p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg">
          <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          <svg id="moonIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.03 9.03 0 0012 21a9.03 9.03 0 008.354-5.646z"></path></svg>
        </button>
        <button id="resetBtn" title="Restaurar dados" class="p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 w-full mx-auto space-y-3 pb-4">

    <!-- Actions & Cards -->
    <div class="max-w-md mx-auto px-3 space-y-3 pt-3">
      <!-- Actions & Filter -->
      <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-2.5">
        <div class="relative">
          <input type="text" id="searchInput" placeholder="Buscar item..." class="w-full pl-9 pr-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-1 focus:ring-brand-500">
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
        
        <div class="flex gap-2">
          <button id="addItemBtn" class="flex-1 bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white py-2 px-3 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1.5 shadow-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            <span>Novo Item</span>
          </button>
          <button id="manageStoresBtn" class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 py-2 px-3 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0v-4m0 4h4m-4-4l-4 4m4-4l4 4"></path></svg>
            <span>Lojas</span>
          </button>
        </div>
      </div>

      <!-- Store Summary (Linha Única) -->
      <div class="bg-white dark:bg-slate-800 px-3 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-x-auto scrollbar-thin">
        <div id="storeSummaries" class="flex items-center justify-around divide-x divide-slate-200 dark:divide-slate-700 min-w-max">
          <!-- Injetado dinamicamente via JS -->
        </div>
      </div>
    </div>

    <!-- Table Container (Largura Total) -->
    <div class="w-full bg-white dark:bg-slate-800 border-y border-slate-200 dark:border-slate-700 overflow-hidden">
      <div class="overflow-x-auto scrollbar-thin max-h-[calc(100vh-250px)] overflow-y-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr id="tableHeaderRow" class="bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700 font-semibold text-slate-600 dark:text-slate-400">
              <!-- Renderizado via JS -->
            </tr>
          </thead>
          <tbody id="itemsTableBody" class="divide-y divide-slate-100 dark:divide-slate-700/50">
            <!-- Linhas dos itens dinâmicas -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Modal Adicionar/Editar Item -->
  <div id="itemModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-sm w-full p-4 space-y-3 shadow-xl border border-slate-200 dark:border-slate-700">
      <h3 id="modalTitle" class="text-sm font-bold text-slate-900 dark:text-white">Adicionar Item</h3>
      
      <form id="itemForm" class="space-y-2.5">
        <input type="hidden" id="itemId">
        
        <div>
          <label class="block text-[11px] font-medium text-slate-500 mb-1">Nome do Item</label>
          <input type="text" id="itemName" required class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-1 focus:ring-brand-500">
        </div>

        <div>
          <label class="block text-[11px] font-medium text-slate-500 mb-1">Descrição / Obs (Ex: 500ml)</label>
          <input type="text" id="itemNote" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-1 focus:ring-brand-500">
        </div>

        <div id="priceInputs" class="space-y-2 pt-1">
          <label class="block text-[11px] font-medium text-slate-500">Preços por Loja (R$)</label>
          <!-- Inputs de preços dinâmicos -->
        </div>

        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" id="closeItemModal" class="px-3.5 py-2 text-xs text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl">Cancelar</button>
          <button type="submit" class="px-3.5 py-2 text-xs bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-semibold">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Gerenciar Lojas -->
  <div id="storeModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-sm w-full p-4 space-y-3 shadow-xl border border-slate-200 dark:border-slate-700">
      <h3 class="text-sm font-bold text-slate-900 dark:text-white">Gerenciar Lojas</h3>
      
      <div id="storeList" class="space-y-1.5 max-h-48 overflow-y-auto">
        <!-- Lista de lojas para editar/remover -->
      </div>

      <div class="flex gap-2 pt-1">
        <input type="text" id="newStoreName" placeholder="Nova Loja..." class="flex-1 px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl">
        <button id="addStoreBtn" class="px-3 py-2 text-xs bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-semibold">Adicionar</button>
      </div>

      <div class="flex justify-end pt-2">
        <button id="closeStoreModal" class="px-3.5 py-2 text-xs text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl">Fechar</button>
      </div>
    </div>
  </div>

  <script>
    // DADOS INICIAIS
    const defaultStores = [
      { id: 's1', name: 'Coop' },
      { id: 's2', name: 'Tauste' },
      { id: 's3', name: 'Garça' }
    ];

    const defaultItems = [
      { id: '1', name: 'Papel Higiênico H', note: 'Familiar c/16 e c/24', checked: false, prices: { s1: 27.90, s2: 27.99, s3: 23.99 } },
      { id: '2', name: 'Listerine', note: '1L / 500ml', checked: false, prices: { s1: 16.98, s2: 36.90, s3: 22.99 } },
      { id: '3', name: 'Asepxia', note: '', checked: false, prices: { s1: 11.45, s2: 11.20, s3: null } },
      { id: '4', name: 'Filtro Café', note: '3 corações', checked: false, prices: { s1: 4.29, s2: 4.29, s3: 4.29 } },
      { id: '5', name: 'Guardanapo', note: '200 folhas', checked: false, prices: { s1: 8.59, s2: 8.59, s3: 7.99 } },
      { id: '6', name: 'Mamão', note: 'por Kg', checked: false, prices: { s1: 11.98, s2: 13.90, s3: 9.99 } },
      { id: '7', name: 'Maçã', note: 'por Kg', checked: false, prices: { s1: 9.45, s2: 9.80, s3: 8.99 } },
      { id: '8', name: 'Banana', note: 'por Kg', checked: false, prices: { s1: 8.35, s2: 7.00, s3: 6.99 } },
      { id: '9', name: 'Uva', note: '', checked: false, prices: { s1: 9.55, s2: null, s3: null } },
      { id: '10', name: 'Pão de Forma', note: '', checked: false, prices: { s1: 10.90, s2: 8.78, s3: 6.99 } },
      { id: '11', name: 'Bisnaguinha', note: '', checked: false, prices: { s1: 9.79, s2: 7.88, s3: 7.99 } }
    ];

    let stores = [];
    let items = [];

    function initData() {
      try {
        const savedStores = localStorage.getItem('mc_stores_v7');
        const savedItems = localStorage.getItem('mc_items_v7');
        stores = savedStores ? JSON.parse(savedStores) : defaultStores;
        items = savedItems ? JSON.parse(savedItems) : defaultItems;
      } catch (e) {
        stores = defaultStores;
        items = defaultItems;
      }
    }

    function saveData() {
      localStorage.setItem('mc_stores_v7', JSON.stringify(stores));
      localStorage.setItem('mc_items_v7', JSON.stringify(items));
    }

    function formatCurrency(value) {
      if (value === null || value === undefined || isNaN(value)) return '-';
      return `R$&nbsp;${value.toFixed(2).replace('.', ',')}`;
    }

    function renderAll() {
      renderHeaders();
      renderItems();
      renderSummaries();
    }

    function renderHeaders() {
      const headerRow = document.getElementById('tableHeaderRow');
      let html = `
        <th class="p-2 sticky-top-left bg-slate-50 dark:bg-slate-900 border-r border-b border-slate-200 dark:border-slate-700 w-[120px] min-w-[120px]">
          ITEM
        </th>
      `;
      
      stores.forEach(store => {
        html += `
          <th class="p-2 text-center uppercase tracking-wider w-[85px] min-w-[85px] sticky-header bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700">
            ${store.name}
          </th>
        `;
      });

      html += `<th class="p-2 text-center w-[36px] min-w-[36px] sticky-header bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700"></th>`;
      headerRow.innerHTML = html;
    }

    function renderItems() {
      const tbody = document.getElementById('itemsTableBody');
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      const filteredItems = items.filter(item => item.name.toLowerCase().includes(searchQuery));

      if (filteredItems.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="${stores.length + 2}" class="p-6 text-center text-slate-400">
              Nenhum item encontrado.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filteredItems.map(item => {
        const validPrices = Object.entries(item.prices)
          .filter(([storeId, price]) => stores.some(s => s.id === storeId) && price !== null && price > 0)
          .map(([_, price]) => price);
        
        const minPrice = validPrices.length > 0 ? Math.min(...validPrices) : null;

        return `
          <tr class="hover:bg-slate-50/80 dark:hover:bg-slate-700/30 ${item.checked ? 'opacity-50 line-through bg-slate-50/50 dark:bg-slate-800/50' : ''}">
            <td class="p-2 sticky-col bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 w-[120px] min-w-[120px]">
              <div class="flex items-center space-x-1.5">
                <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleItemCheck('${item.id}')" class="rounded border-slate-300 text-brand-600 focus:ring-brand-500 w-3.5 h-3.5 flex-shrink-0">
                <div class="truncate">
                  <div class="font-semibold text-slate-900 dark:text-slate-100 truncate text-xs">${item.name}</div>
                  ${item.note ? `<div class="text-[10px] text-slate-400 dark:text-slate-500 truncate">${item.note}</div>` : ''}
                </div>
              </div>
            </td>

            ${stores.map(store => {
              const price = item.prices[store.id];
              const isCheapest = price !== null && price === minPrice && validPrices.length > 1;
              return `
                <td class="p-2 text-center whitespace-nowrap w-[85px] min-w-[85px]">
                  <span class="inline-block px-1.5 py-1 rounded-lg ${isCheapest ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/80 dark:text-emerald-300' : 'text-slate-600 dark:text-slate-300'} text-xs">
                    ${formatCurrency(price)}
                  </span>
                </td>
              `;
            }).join('')}

            <td class="p-2 text-center w-[36px] min-w-[36px]">
              <button onclick="openEditItemModal('${item.id}')" class="text-slate-400 hover:text-brand-600 p-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderSummaries() {
      const container = document.getElementById('storeSummaries');
      
      const totals = stores.map(store => {
        let total = 0;
        let count = 0;
        items.forEach(item => {
          if (item.prices[store.id] !== undefined && item.prices[store.id] !== null) {
            total += item.prices[store.id];
            count++;
          }
        });
        return { ...store, total, count };
      });

      const validTotals = totals.filter(t => t.count > 0).map(t => t.total);
      const minTotal = validTotals.length > 0 ? Math.min(...validTotals) : null;

      container.innerHTML = totals.map(store => {
        const isBestOption = store.total > 0 && store.total === minTotal && validTotals.length > 1;
        return `
          <div class="flex-1 px-3 text-center min-w-[100px] relative">
            <div class="flex items-center justify-center space-x-1">
              <span class="text-[11px] font-medium text-slate-500 dark:text-slate-400 truncate">${store.name}</span>
              ${isBestOption ? '<span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500" title="Mais Barato"></span>' : ''}
            </div>
            <div class="text-xs font-bold ${isBestOption ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-900 dark:text-white'} leading-tight mt-0.5">
              ${formatCurrency(store.total)}
            </div>
            <div class="text-[9px] text-slate-400 mt-0.5">${store.count}/${items.length} itens</div>
          </div>
        `;
      }).join('');
    }

    function toggleItemCheck(id) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.checked = !item.checked;
        saveData();
        renderAll();
      }
    }

    const itemModal = document.getElementById('itemModal');
    document.getElementById('addItemBtn').onclick = () => openItemModal();
    document.getElementById('closeItemModal').onclick = () => itemModal.classList.add('hidden');

    function openItemModal(item = null) {
      document.getElementById('modalTitle').innerText = item ? 'Editar Item' : 'Novo Item';
      document.getElementById('itemId').value = item ? item.id : '';
      document.getElementById('itemName').value = item ? item.name : '';
      document.getElementById('itemNote').value = item ? (item.note || '') : '';

      const priceInputsContainer = document.getElementById('priceInputs');
      priceInputsContainer.innerHTML = stores.map(store => `
        <div class="flex items-center justify-between gap-2">
          <span class="text-xs text-slate-600 dark:text-slate-300 w-24 truncate font-medium">${store.name}</span>
          <input type="number" step="0.01" data-store-id="${store.id}" value="${item && item.prices[store.id] !== undefined && item.prices[store.id] !== null ? item.prices[store.id] : ''}" placeholder="0,00" class="store-price-input flex-1 px-3 py-1.5 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl">
        </div>
      `).join('');

      itemModal.classList.remove('hidden');
    }

    function openEditItemModal(id) {
      const item = items.find(i => i.id === id);
      if (item) openItemModal(item);
    }

    document.getElementById('itemForm').onsubmit = (e) => {
      e.preventDefault();
      const id = document.getElementById('itemId').value;
      const name = document.getElementById('itemName').value;
      const note = document.getElementById('itemNote').value;

      const prices = {};
      document.querySelectorAll('.store-price-input').forEach(input => {
        const storeId = input.getAttribute('data-store-id');
        const val = parseFloat(input.value);
        prices[storeId] = isNaN(val) ? null : val;
      });

      if (id) {
        const item = items.find(i => i.id === id);
        if (item) {
          item.name = name;
          item.note = note;
          item.prices = prices;
        }
      } else {
        items.push({
          id: Date.now().toString(),
          name,
          note,
          checked: false,
          prices
        });
      }

      saveData();
      renderAll();
      itemModal.classList.add('hidden');
    };

    const storeModal = document.getElementById('storeModal');
    document.getElementById('manageStoresBtn').onclick = () => openStoreModal();
    document.getElementById('closeStoreModal').onclick = () => storeModal.classList.add('hidden');

    function openStoreModal() {
      const storeList = document.getElementById('storeList');
      storeList.innerHTML = stores.map(store => `
        <div class="flex items-center justify-between bg-slate-50 dark:bg-slate-900 p-2.5 rounded-xl">
          <span class="text-xs font-semibold text-slate-700 dark:text-slate-200">${store.name}</span>
          <button onclick="removeStore('${store.id}')" class="text-rose-500 hover:text-rose-700 p-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          </button>
        </div>
      `).join('');
      storeModal.classList.remove('hidden');
    }

    document.getElementById('addStoreBtn').onclick = () => {
      const input = document.getElementById('newStoreName');
      const name = input.value.trim();
      if (name) {
        stores.push({ id: 's_' + Date.now(), name });
        input.value = '';
        saveData();
        renderAll();
        openStoreModal();
      }
    };

    function removeStore(id) {
      if (stores.length <= 1) {
        alert('Você precisa ter pelo menos uma loja cadastrada.');
        return;
      }
      stores = stores.filter(s => s.id !== id);
      saveData();
      renderAll();
      openStoreModal();
    }

    document.getElementById('searchInput').oninput = () => renderItems();

    document.getElementById('resetBtn').onclick = () => {
      if (confirm('Deseja restaurar os dados originais?')) {
        stores = defaultStores;
        items = defaultItems;
        saveData();
        renderAll();
      }
    };

    const themeToggle = document.getElementById('themeToggle');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      sunIcon.classList.remove('hidden');
      moonIcon.classList.add('hidden');
    }

    themeToggle.onclick = () => {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      initData();
      renderAll();
    });
  </script>
</body>
</html>
